[package]
name = "dinorunner-web"
version = "0.1.0"
edition = "2021"
authors = ["AKJ7"]
description = "libdinorunner running in the browser, compiled to WebAssembly"
license = "GPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
dinorunner = { path = "../../binding/rust" }
# Must match the installed wasm-bindgen CLI exactly, see build.sh
wasm-bindgen = "=0.2.129"

[dependencies.web-sys]
version = "0.3"
features = [
    "CanvasRenderingContext2d",
    "console",
    "Document",
    "DomTokenList",
    "Element",
    "Event",
    "EventTarget",
    "HtmlAudioElement",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlImageElement",
    "HtmlMediaElement",
    "KeyboardEvent",
    "Navigator",
    "Performance",
    "Storage",
    "Window",
]

[profile.release]
opt-level = "s"
lto = true
